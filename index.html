<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eclipse Launcher</title>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
    body {
      margin: 0; padding: 24px;
      background: #0f1117; color: #f1f5f9;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; border-bottom: 1px solid #1e293b; padding-bottom: 16px;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
    button {
      border: none; border-radius: 6px; padding: 8px 16px;
      font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    .btn-add { background: #22c55e; color: #052e16; }
    .btn-add:hover { background: #16a34a; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .card {
      background: #181c26; border: 1px solid #262c3a; border-radius: 10px;
      padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .game-title { font-size: 16px; font-weight: 700; margin: 0; word-break: break-word; }
    .icon-btn { background: transparent; color: #94a3b8; padding: 4px 6px; font-size: 13px; }
    .icon-btn:hover { color: #ffffff; background: #262c3a; }
    .playtime { font-size: 13px; color: #94a3b8; margin: 10px 0 16px; }
    .btn-play { background: #3b82f6; color: white; width: 100%; padding: 10px; }
    .btn-play:hover { background: #2563eb; }
    .btn-play.running { background: #eab308; color: #1e1b04; cursor: default; }
    .empty { color: #64748b; text-align: center; margin-top: 60px; }
  </style>
</head>
<body>
  <header>
    <h1>GAME LIBRARY</h1>
    <button class="btn-add" id="addBtn">+ Add Game</button>
  </header>

  <div id="library" class="grid"></div>

  <script>
    let games = [];
    const runningIds = new Set();

    function formatPlaytime(totalSeconds = 0) {
      if (totalSeconds < 60) return `${totalSeconds}s played`;
      const hours = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      return hours > 0 ? `${hours}h ${mins}m played` : `${mins}m played`;
    }

    function render() {
      const container = document.getElementById("library");
      if (!games.length) {
        container.className = "";
        container.innerHTML = `<p class="empty">No games yet. Click <b>+ Add Game</b> to create your library.</p>`;
        return;
      }

      container.className = "grid";
      container.innerHTML = games.map((game) => {
        const isRunning = runningIds.has(game.id);
        return `
          <div class="card">
            <div>
              <div class="title-row">
                <h3 class="game-title">${game.name}</h3>
                <div>
                  <button class="icon-btn" title="Rename" onclick="renameGame('${game.id}', '${game.name.replace(/'/g, "\\'")}')">✎</button>
                  <button class="icon-btn" title="Remove" onclick="removeGame('${game.id}')">✕</button>
                </div>
              </div>
              <div class="playtime">⏱ ${formatPlaytime(game.playtimeSeconds)}</div>
            </div>
            <button class="btn-play ${isRunning ? "running" : ""}"
              ${isRunning ? "disabled" : ""}
              onclick="launchGame('${game.id}')">
              ${isRunning ? "RUNNING..." : "PLAY"}
            </button>
          </div>
        `;
      }).join("");
    }

    document.getElementById("addBtn").addEventListener("click", async () => {
      const updated = await window.launcherAPI.addGame();
      if (updated) {
        games = updated;
        render();
      }
    });

    async function launchGame(id) {
      runningIds.add(id);
      render();
      const res = await window.launcherAPI.launchGame(id);
      if (res?.error) {
        runningIds.delete(id);
        alert(res.error);
        render();
      }
    }

    async function renameGame(id, currentName) {
      const newName = prompt("Enter game title:", currentName);
      if (newName) {
        games = await window.launcherAPI.renameGame(id, newName);
        render();
      }
    }

    async function removeGame(id) {
      games = await window.launcherAPI.removeGame(id);
      render();
    }

    window.launcherAPI.onGameStopped(({ id, games: updatedGames, error }) => {
      runningIds.delete(id);
      if (error) alert("Error: " + error);
      games = updatedGames;
      render();
    });

    (async () => {
      games = await window.launcherAPI.getGames();
      render();
    })();
  </script>
</body>
</html>
